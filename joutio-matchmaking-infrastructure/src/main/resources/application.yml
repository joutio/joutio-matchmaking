spring:
  config:
    import: optional:classpath:joutio-defaults.yml
  profiles:
    default: local
  application:
    name: joutio-matchmaking

  flyway:
    locations: classpath:db/migration/matchmaking

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

microservice:
  swagger:
    description: Joutio Matchmaking Module - Room-based player matching
  websocket:
    # Surface REST/WS portée par le BFF ; les services sont headless.
    enabled: false

joutio:
  axon:
    # Groupes chauds segmentés : un thread par segment et par réplique, répartition entre
    # répliques par le rééquilibreur du SDK. Appliqué à la création du token (base vierge).
    processors:
      room-saga:
        segments: 4
      matchmaking-saga:
        segments: 4
      room-projection:
        segments: 4
      matchmaking-projection:
        segments: 4
